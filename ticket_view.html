*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Roboto',sans-serif;background:linear-gradient(135deg, #1a472a 0%, #2d5a3d 50%, #1a472a 100%);color:#333;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.header{text-align:center;color:#fff;margin-bottom:24px;}
.header h1{font-size:20px;font-weight:700;margin-bottom:4px;}
.header p{font-size:13px;opacity:0.8;}
.ticket-card{background:#fff;border-radius:16px;padding:24px 20px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.2);max-width:360px;width:100%;margin:0 auto;}
.tc-logo{width:80px;height:auto;border-radius:8px;margin-bottom:8px;}
.tc-title{font-size:17px;font-weight:700;color:#1a472a;margin-bottom:2px;}
.tc-sub{font-size:11px;font-weight:600;color:#666;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px;}
.tc-num{font-size:14px;font-weight:700;color:#1565c0;margin:8px 0;font-family:monospace;letter-spacing:1px;}
.tc-detail{font-size:14px;color:#444;margin:4px 0;line-height:1.6;}
.tc-detail b{color:#1a1a1a;}
.tc-sep{height:1px;background:#e0e0e0;margin:12px 0;}
.tc-qr{margin:16px auto;display:flex;justify-content:center;padding:10px;background:#fff;border-radius:8px;}
.tc-badge{display:inline-block;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:700;text-transform:uppercase;margin-top:10px;background:#e8f5e9;color:#2e7d32;}
.footer{text-align:center;color:rgba(255,255,255,0.6);margin-top:20px;font-size:12px;}
.error-card{background:#fff;border-radius:16px;padding:40px 24px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.2);max-width:360px;width:100%;}
.error-icon{font-size:48px;margin-bottom:12px;}
.error-title{font-size:18px;font-weight:700;color:#c62828;margin-bottom:8px;}
.error-msg{font-size:14px;color:#666;}
</style>

  var TYPES={demi:'Demi-journée',journee:'Journée',nuit:'Nuit'};
  var container=document.getElementById('ticket-container');

  function getParam(name){
    var url=new URL(window.location.href);
    return url.searchParams.get(name)||'';
  }

  var id=getParam('id');
  var lieu=getParam('lieu');
  var type=getParam('type');
  var prix=getParam('prix');
  var carte=getParam('carte');
  var date=getParam('date');
  var sig=getParam('sig');

  if(!id||!lieu||!prix){
    container.innerHTML=
      '<div class="error-card">'+
        '<div class="error-icon">❌</div>'+

  try{d=new Date(date);}catch(e){d=new Date();}
  var dateFr=d.toLocaleDateString('fr-FR');
  var heureFr=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  var lieuName=LIEUX[lieu]||lieu;
  var typeName=TYPES[type]||type;

      colorDark:'#000000',colorLight:'#ffffff',
